services:
  scheduler:
    build: .
    image: maintenance-scheduler:latest
    container_name: maintenance-scheduler
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - scheduler-data:/data
    environment:
      # SQLite 数据库路径（容器内），默认已在 /data 卷中
      MW_DATA_DIR: /data
      # 如只想用宿主文件而非命名卷，可挂载并指定：
      # MW_DB_PATH: /data/maintenance.db
    restart: unless-stopped

volumes:
  scheduler-data:
